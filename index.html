<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Scanner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PASSWORD SCREEN -->

    <div class="scanner-container" id="passwordScreen">

        <div class="lock">🔐</div>

        <h1>SECRET ACCESS</h1>

        <p class="subtitle">
            This file is protected.<br>
            Enter the secret password to continue...
        </p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
        >

        <button id="passwordButton">
            UNLOCK
        </button>

        <p id="passwordStatus"></p>

    </div>


    <!-- SCANNER SCREEN -->

    <div class="scanner-container" id="scannerScreen" style="display: none;">

        <div class="lock">🔐</div>

        <h1>SECRET FILE DETECTED</h1>

        <p class="subtitle">
            A special message is waiting for you...
        </p>

        <div class="scanner-box">
            <div class="scan-line"></div>
        </div>

        <p id="status">Initializing Secret Scanner...</p>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <button id="openButton">
            ACCESS FILE
        </button>

    </div>


    <script src="node.js"></script>

</body>
</html>
